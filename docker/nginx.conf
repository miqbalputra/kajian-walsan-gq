user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Enable compression only in public asset locations below.
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        charset utf-8;

        # Vite changes the filename whenever an asset changes, so these files
        # can be cached for a year without serving an older release.
        location ~ "^/build/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif)$" {
            try_files $uri =404;
            gzip on;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }

        # Mutable public assets use a shorter cache lifetime. Uploads and
        # authenticated pages retain their existing response headers.
        location ~ "^/(icons|js)/.*\.(css|js|svg|png|jpe?g|ico|webp)$" {
            try_files $uri =404;
            gzip on;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }

        # The browser must be able to discover service-worker updates.
        location = /sw.js {
            try_files $uri =404;
            gzip on;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
